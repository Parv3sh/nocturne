name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tizen/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nocturne-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-apk
          path: nocturne-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" nocturne-*.apk --target "$GITHUB_SHA" --generate-notes
